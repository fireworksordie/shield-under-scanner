name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build
        shell: bash
        run: |
          set +e
          gradle assembleDebug --no-daemon --console=plain > build.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            msg=$(grep -E "^e: |error:|FAILED|What went wrong|Could not|Execution failed|^> " build.log | head -40 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Gradle failure::$msg"
          fi
          exit $rc
      - uses: actions/upload-artifact@v4
        with:
          name: OverscanToggle-debug
          path: app/build/outputs/apk/debug/app-debug.apk
